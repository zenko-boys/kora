<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Kora — Mockups</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #e9e9e9;
    font-family: 'Inter', -apple-system, sans-serif;
    padding: 40px 24px 60px;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: #151A1F;
    margin: 0 0 4px;
  }
  p.sub {
    text-align: center;
    font-size: 13px;
    color: #7A8079;
    margin: 0 0 32px;
  }
  .row {
    display: flex;
    flex-direction: column;
    gap: 40px;
    align-items: center;
  }
  .frame-block { width: 100%; max-width: 1400px; }
  .frame-label {
    font-size: 13px;
    font-weight: 700;
    color: #151A1F;
    margin: 0 0 10px;
    text-align: center;
  }
  iframe {
    width: 100%;
    height: 900px;
    border: none;
    display: block;
  }
</style>
</head>
<body>
  <h1>Kora — Fluxo de Reservas</h1>
  <p class="sub">Reservas → Criar Jogo</p>
  <div class="row">
    <div class="frame-block">
      <div class="frame-label">Reservas</div>
      <iframe src="kora-tela-reservas.html"></iframe>
    </div>
    <div class="frame-block">
      <div class="frame-label">Criar Jogo</div>
      <iframe src="kora-criar-jogo.html"></iframe>
    </div>
  </div>
</body>
</html>
